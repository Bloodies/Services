services:
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.28-alpine}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-80}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:8891:8891"
      - "${BIND_ADDRESS:-127.0.0.1}:8811:8811"
    volumes:
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - ./nginx/minio.conf:/etc/nginx/conf.d/minio.conf:ro
      - ./nginx/data:/data/frigate/clips:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
