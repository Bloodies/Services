services:
  redis_cache:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: [redis-server, --appendonly, 'yes']
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SENTINEL_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [development]

  redis_sentinel:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      redis_cache:
        condition: service_healthy
    # Sentinel rewrites its config; keep the template read-only and copy it to writable storage.
    command: [sh, -ec, 'test -f /data/sentinel.conf || cp /etc/redis/sentinel.conf /data/sentinel.conf; exec redis-sentinel /data/sentinel.conf']
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SENTINEL_PORT:-26379}:26379"
    volumes:
      - ./sentinel.conf:/etc/redis/sentinel.conf:ro
      - sentinel_data:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -p 26379 ping | grep -qx PONG']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [development]

networks:
  development:
    name: ${DEVELOPMENT_NETWORK:-development}
    external: true

volumes:
  redis_data:
  sentinel_data:
