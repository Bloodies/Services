services:
  rtsp-server:
    image: ${MEDIAMTX_IMAGE:?Set MEDIAMTX_IMAGE compatible with mediamtx.yml}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${MEDIA_BIND_ADDRESS:-127.0.0.1}:1935:1935"
      - "${MEDIA_BIND_ADDRESS:-127.0.0.1}:8554:8554"
      - "${MEDIA_BIND_ADDRESS:-127.0.0.1}:8888:8888"
      - "${MEDIA_BIND_ADDRESS:-127.0.0.1}:8889:8889"
      - "${MEDIA_BIND_ADDRESS:-127.0.0.1}:8890:8890/udp"
      - "${MEDIA_BIND_ADDRESS:-127.0.0.1}:8189:8189/udp"
    environment:
      MTX_PROTOCOLS: tcp
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_PUBLIC_HOST:-127.0.0.1}
      MTX_AUTHJWTJWKS: ${MEDIAMTX_JWKS_URL:-http://keycloak:8080/realms/mediamtx/protocol/openid-connect/certs}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks: [development]
 
  camera_filler:
    profiles: [samples]
    image: ${FFMPEG_IMAGE:-linuxserver/ffmpeg:version-4.4-cli}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on: [rtsp-server]
    volumes:
      - ./samples:/media:ro
    command: [-re, -stream_loop, '-1', -i, '/media/${CAMERA_SAMPLE:-segment_1.mp4}', -c, copy, -bsf:v, h264_mp4toannexb, -rtsp_transport, tcp, -f, rtsp, '${CAMERA_RTSP_URL:?Set CAMERA_RTSP_URL including a valid JWT}']
    networks: [development]

networks:
  development:
    name: ${DEVELOPMENT_NETWORK:-development}
    external: true
