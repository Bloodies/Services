services:
  camera_stream:
    image: ${FFMPEG_IMAGE:-linuxserver/ffmpeg:version-4.4-cli}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./:/media:ro
    # Use rtsp-server:8554 on the shared network, never localhost inside this container.
    command: [-re, -stream_loop, '-1', -i, '/media/${CAMERA_SAMPLE:-city_street.mp4}', -bsf:v, h264_mp4toannexb, -c, copy, -rtsp_transport, tcp, -f, rtsp, '${CAMERA_RTSP_URL:?Set CAMERA_RTSP_URL including a valid JWT}']
    networks: [development]
networks:
  development:
    name: ${DEVELOPMENT_NETWORK:-development}
    external: true
