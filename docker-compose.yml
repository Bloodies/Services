services:
  postgres:
    extends:
      file: docker-compose.postgres.yml
      service: postgres
    networks: [development]
  minio:
    extends:
      file: docker-compose.minio.yml
      service: minio
    networks: [development]
  mongo:
    extends:
      file: docker-compose.mongo.yml
      service: mongo
    networks: [development]
  rabbitmq:
    extends:
      file: docker-compose.rabbitmq.yml
      service: rabbitmq
    networks: [development]
  redis:
    extends:
      file: docker-compose.redis.yml
      service: redis
    networks: [development]
  keycloak:
    extends:
      file: docker-compose.keycloak.yml
      service: keycloak
    networks: [development]
  nginx:
    extends:
      file: docker-compose.nginx.yml
      service: nginx
    networks: [development]

networks:
  development:
    name: ${DEVELOPMENT_NETWORK:-development}
    driver: bridge

volumes:
  mongo_data:
  mongo_config:
  rabbitmq_data:
  keycloak_data:
