services:
  minio:
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE to a tested image tag or digest}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?Set MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${MINIO_DATA_DIR:-~/minio}:/data
    command: [server, --console-address, ':9001', --address, ':9000', /data]
    # Readiness endpoint: /minio/health/ready. Probe externally if the image has no HTTP client.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
